name: Sonda de tenis

# Revisa qué fuentes de tenis hay (ESPN y Kalshi). No guarda nada.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cat > s.js <<'JS'
          const get = async u => { try { const r = await fetch(u, { headers: { 'user-agent': 'tigre/1.0', accept: 'application/json' } }); return r.ok ? r.json() : { http: r.status }; } catch (e) { return { err: e.message }; } };
          const c = (o, n) => String(JSON.stringify(o)).slice(0, n || 1500);
          (async () => {
            for (const t of ['atp', 'wta']) {
              const sb = await get('https://site.api.espn.com/apis/site/v2/sports/tennis/' + t + '/scoreboard');
              const ev = (sb.events || []);
              console.log('==== ESPN ' + t + ' eventos ' + ev.length + ' ' + ev.map(e => e.name).slice(0, 5).join(' | '));
              const comps = ev.flatMap(e => (e.groupings || []).flatMap(g => g.competitions || []).concat(e.competitions || []));
              console.log('  partidos ' + comps.length + ' con odds ' + comps.filter(x => x.odds).length + ' ej ' + c(comps[0], 900));
            }
            const K = 'https://api.elections.kalshi.com/trade-api/v2';
            const ser = await get(K + '/series?category=Sports&limit=1000');
            const ten = (ser.series || []).filter(s => /tennis|ATP|WTA|davis/i.test((s.title || '') + ' ' + (s.ticker || '')));
            console.log('==== Kalshi series de tenis: ' + ten.map(s => s.ticker + ' (' + s.title + ')').join(' | '));
            for (const s of ['KXATPMATCH', 'KXWTAMATCH'].concat(ten.map(x => x.ticker)).slice(0, 12)) {
              const ab = await get(K + '/events?series_ticker=' + s + '&status=open&with_nested_markets=true&limit=200');
              const ce = await get(K + '/events?series_ticker=' + s + '&status=settled&with_nested_markets=true&limit=3');
              console.log('-- ' + s + ': abiertos ' + ((ab.events || []).length) + ' · ejemplo abierto ' + c(ab.events && ab.events[0] && { t: ab.events[0].event_ticker, title: ab.events[0].title, sub: ab.events[0].sub_title, m: (ab.events[0].markets || []).map(m => ({ tk: m.ticker, st: m.status, y: m.yes_sub_title, b: m.yes_bid_dollars, a: m.yes_ask_dollars, vol: m.volume_fp || m.volume, oc: m.occurrence_datetime, exp: m.expected_expiration_time })) }, 900));
              console.log('   liquidado ' + c(ce.events && ce.events[0] && { t: ce.events[0].event_ticker, m: (ce.events[0].markets || []).map(m => ({ tk: m.ticker, st: m.status, y: m.yes_sub_title, res: m.result, last: m.last_price_dollars })) }, 700));
            }
          })();
          JS
          node s.js
