name: Página

# Publica la página (index.html) en GitHub Pages cada vez que cambia en main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "manifest.json", "icono-*.png"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pub.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: mkdir -p _sitio && cp index.html manifest.json icono-*.png _sitio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: pub
        uses: actions/deploy-pages@v4
