name: Sonda de fuentes

# Solo para revisar cómo vienen los datos crudos (ESPN, Kalshi). No guarda nada.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Mirar fuentes
        run: |
          cat > s.js <<'JS'
          const get = async u => { const r = await fetch(u, { headers: { 'user-agent': 'tigre/1.0', accept: 'application/json' } }); return r.ok ? r.json() : { http: r.status }; };
          const corto = (o, n) => JSON.stringify(o).slice(0, n || 3000);
          (async () => {
            const S = 'https://site.api.espn.com/apis/site/v2/sports/', C = 'https://sports.core.api.espn.com/v2/sports/';
            for (const [ruta, liga] of [['basketball/nba', 'basketball/leagues/nba'], ['soccer/eng.1', 'soccer/leagues/eng.1'], ['hockey/nhl', 'hockey/leagues/nhl'], ['football/nfl', 'football/leagues/nfl']]) {
              const sb = await get(S + ruta + '/scoreboard');
              const evs = sb.events || [];
              console.log('==== ' + ruta + ' eventos ' + evs.length + ' estados: ' + evs.map(e => e.status && e.status.type && e.status.type.state).join(','));
              const e = evs.find(x => x.status && x.status.type && x.status.type.state === 'pre') || evs[0];
              if (!e) continue;
              console.log('competencia odds del scoreboard: ' + corto((e.competitions[0].odds || [])[0], 2500));
              const od = await get(C + liga + '/events/' + e.id + '/competitions/' + e.id + '/odds');
              console.log('core odds proveedores: ' + (od.items || []).map(i => i.provider && (i.provider.id + ':' + i.provider.name)).join(' | '));
              const it = (od.items || []).find(i => i.provider && i.provider.id == '100') || (od.items || [])[0];
              console.log('core odds item: ' + corto(it, 6000));
              if (ruta === 'basketball/nba') {
                const pb = await get(C + liga + '/events/' + e.id + '/competitions/' + e.id + '/odds/100/propBets?limit=1000&page=1');
                console.log('propBets pageCount ' + pb.pageCount + ' count ' + pb.count + ' tipos: ' + [...new Set((pb.items || []).map(i => i.type && i.type.name))].slice(0, 40).join(' | '));
                console.log('propBet ejemplo: ' + corto((pb.items || []).slice(0, 3), 3000));
                const sm = await get(S + ruta + '/summary?event=' + (evs.find(x => x.status.type.state === 'post') || e).id);
                console.log('summary boxscore: ' + corto(sm.boxscore && sm.boxscore.players && sm.boxscore.players[0] && sm.boxscore.players[0].statistics, 1500));
              }
            }
            const K = 'https://api.elections.kalshi.com/trade-api/v2';
            for (const s of ['KXNBAGAME', 'KXNBASPREAD', 'KXNBATOTAL', 'KXNHLGAME', 'KXNFLGAME', 'KXEPLGAME']) {
              const j = await get(K + '/events?series_ticker=' + s + '&status=open&with_nested_markets=true&limit=3');
              console.log('==== kalshi ' + s + ' eventos ' + ((j.events || []).length) + ' ' + corto(j.events && j.events[0], 1800));
            }
          })();
          JS
          node s.js
