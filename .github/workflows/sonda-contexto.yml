name: Sonda de contexto

# Revisa qué datos de forma y récord trae ESPN en el marcador. No guarda nada.
on:
  workflow_dispatch:

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cat > s.js <<'JS'
          const get = async u => { try { const r = await fetch(u); return r.ok ? r.json() : { http: r.status }; } catch (e) { return { err: e.message }; } };
          (async () => {
            for (const r of ['soccer/esp.1', 'soccer/eng.1', 'basketball/nba', 'hockey/nhl', 'football/nfl', 'basketball/mens-college-basketball']) {
              const sb = await get('https://site.api.espn.com/apis/site/v2/sports/' + r + '/scoreboard?dates=20261128&limit=50');
              const e = (sb.events || [])[0]; if (!e) { console.log('== ' + r + ' sin eventos'); continue; }
              const c = e.competitions[0].competitors[0];
              console.log('== ' + r + ' llaves: ' + Object.keys(c).join(','));
              console.log('   form: ' + JSON.stringify(c.form) + ' · records: ' + JSON.stringify(c.records) + ' · statistics: ' + JSON.stringify((c.statistics || []).slice(0, 3)).slice(0, 300));
            }
          })();
          JS
          node s.js
