<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TIGRE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<title>TIGRE · lectura de líneas</title>
<meta name="tigre-version" content="2026-11-22">
<style>
:root{--bg:#0b0b0d;--card:#151518;--card2:#1c1c21;--line:#2a2a31;--tx:#f2f0ea;--mut:#9a978f;--oro:#f59e0b;--naranja:#fb923c;--good:#34d399;--bad:#f87171;--mid:#fbbf24;--azul:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 10px 14px -6px var(--bg);padding:14px 16px 10px}
.marca{display:flex;align-items:center;gap:10px}
.marca .logo{width:38px;height:38px;border-radius:11px;background:conic-gradient(from 200deg,#f59e0b,#fb923c,#111 40%,#f59e0b 55%,#111 70%,#fb923c);display:grid;place-items:center;font-weight:900;color:#0b0b0d;font-size:20px;box-shadow:0 0 18px rgba(245,158,11,.35)}
.marca h1{margin:0;font-size:22px;letter-spacing:.12em;font-weight:900}
.marca small{display:block;color:var(--mut);font-size:12px;letter-spacing:0}
.estado{margin-top:8px;font-size:12.5px;color:var(--mut);display:flex;gap:8px;align-items:flex-start}
.estado .punto{flex:none;margin-top:5px}
.punto{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good)}
.punto.viejo{background:var(--bad);box-shadow:0 0 8px var(--bad)}
main{padding:0 14px}
.vista{display:none}.vista.on{display:block;animation:entra .25s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--oro);margin:20px 2px 8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:999px;font-size:13px}
.chip.on{background:var(--oro);color:#111;border-color:var(--oro);font-weight:700}
.chip.cero{opacity:.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:9px 0}
.sen{position:relative;overflow:hidden}
.sen:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--oro)}
.sen.rapido:before{background:var(--naranja)}.sen.kalshi:before{background:var(--azul)}
.fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.meta{color:var(--mut);font-size:12.5px}
.txt{font-size:16.5px;font-weight:700;margin:4px 0 2px}
.desc{font-size:14px;color:#d6d3cb}
.mag{flex:none;font-weight:800;color:var(--oro);font-size:14px}
.res{font-weight:800}.res.gana{color:var(--good)}.res.pierde{color:var(--bad)}.res.push,.res.nula{color:var(--mut)}
.vacio{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
.juego .eq{font-weight:700;font-size:15.5px}
.mk{display:grid;grid-template-columns:76px 1fr 1fr 58px;gap:6px;align-items:center;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.mk:first-of-type{border-top:0}
.mk .n{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.mk .ab{color:var(--mut)}.mk .ah{font-weight:700}
.sube{color:var(--good)}.baja{color:var(--bad)}
svg.spark{width:58px;height:22px}
details{margin-top:6px}summary{color:var(--oro);font-size:13px;cursor:pointer;padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tabla{overflow-x:auto}
.partido .mov{border-top:1px solid var(--line);margin-top:9px;padding:9px 0 0 10px;position:relative}
.partido .mov:before{content:"";position:absolute;left:0;top:11px;bottom:2px;width:3px;border-radius:2px;background:var(--oro)}
.partido .mov.rapido:before{background:var(--naranja)}.partido .mov.kalshi:before{background:var(--azul)}
.partido .txt{font-size:15.5px}
.ahora{margin-top:6px;font-size:13.5px;padding:6px 9px;border-radius:10px;background:var(--card2)}
.ahora.verde{border:1px solid rgba(52,211,153,.35)}.ahora.amarillo{border:1px solid rgba(251,191,36,.4)}.ahora.rojo{border:1px solid rgba(248,113,113,.4)}.ahora.gris{color:var(--mut)}
.ayuda{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}.ayuda .lista{padding-left:18px;font-size:13px;color:#d6d3cb}
.barra{height:8px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:5px}.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--naranja),var(--oro))}
.ficha{margin-top:10px;padding:10px 11px;border-radius:13px;background:linear-gradient(180deg,rgba(245,158,11,.08),rgba(245,158,11,.02));border:1px solid rgba(245,158,11,.25)}
.ficha .fila{flex-wrap:wrap;row-gap:4px}.ficha .fila b{font-size:14.5px}.ficha .sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.puntos{margin-top:6px}.pto{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0;color:#d6d3cb}.pto>span{flex:none;width:18px}.pto b{color:var(--tx);font-weight:600}
.pto.sin{opacity:.55}
details.fz{margin-top:6px}details.fz summary{list-style:none}details.fz summary::-webkit-details-marker{display:none}
.rec{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12.5px}
.sello{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:11.5px;font-weight:700;margin-right:4px}.sello.ok{color:var(--good);border-color:rgba(52,211,153,.4)}.sello.mal{color:var(--bad);border-color:rgba(248,113,113,.4)}
.nota{color:var(--mut);font-size:12.5px;margin-top:8px}
.aviso{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);border-radius:14px;padding:11px 13px;font-size:13.5px;margin:10px 0}
.pos{color:var(--good)}.neg{color:var(--bad)}
.grande{font-size:28px;font-weight:900;letter-spacing:-.02em}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.resumen .card{margin:0;text-align:center;padding:11px 6px}
.resumen .meta{font-size:11.5px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;background:rgba(18,18,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button span{font-size:21px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--oro)}nav button.on span{filter:none;opacity:1}
p{margin:6px 0}
.lista li{margin:6px 0}
</style>
</head>
<body>
<header>
  <div class="marca"><div class="logo">🐯</div><div><h1>TIGRE</h1><small>Lectura de líneas · DraftKings + Kalshi</small></div></div>
  <div class="estado" id="estado"><span class="punto"></span><span>Cargando…</span></div>
</header>
<main>
  <section class="vista on" id="v-senales"></section>
  <section class="vista" id="v-antes"></section>
  <section class="vista" id="v-juegos"></section>
  <section class="vista" id="v-medir"></section>
  <section class="vista" id="v-info"></section>
</main>
<nav>
  <button class="on" data-v="senales"><span>🎯</span>Señales</button>
  <button data-v="antes"><span>📅</span>Antes</button>
  <button data-v="juegos"><span>📊</span>Líneas</button>
  <button data-v="medir"><span>🧪</span>Medición</button>
  <button data-v="info"><span>📖</span>Cómo funciona</button>
</nav>
<script>
'use strict';
const BASE = 'https://raw.githubusercontent.com/osvaldoalvarez0113-source/TIGRE/datos/';
const D = {}; let FILTRO = 'todas', PROPS = false, DEPO = 'todos', LIGA = 'todas';
/* deportes y ligas que vigila el robot (las que no tienen juegos en la ventana salen en gris con 0) */
const DEPORTES = [['basquet', '🏀 Básquet', ['NBA', 'NCAA Básquet']], ['americano', '🏈 Americano', ['NFL', 'NCAA Football']], ['hockey', '🏒 Hockey', ['NHL']],
  ['futbol', '⚽ Fútbol', ['Premier League', 'La Liga', 'Serie A', 'Bundesliga', 'Ligue 1', 'Champions', 'Europa League', 'MLS', 'Liga MX']],
  ['tenis', '🎾 Tenis', ['Tenis ATP', 'Tenis WTA', 'Challenger', 'Copa Davis']], ['beisbol', '⚾ Béisbol', ['MLB']]];
const deporteDe = liga => { const d = DEPORTES.find(x => x[2].includes(liga)); return d ? d[0] : 'futbol'; };
const pasaLiga = liga => (DEPO === 'todos' || deporteDe(liga) === DEPO) && (LIGA === 'todas' || liga === LIGA);
/* dos filas de filtros: deporte y, si hay uno escogido, sus ligas (con cuántos hay de cada una) */
function chipsLigas(ligas) {
  const n = {}; ligas.forEach(l => { n[l] = (n[l] || 0) + 1; });
  const porDep = d => d[2].reduce((a, l) => a + (n[l] || 0), 0);
  let h = '<div class="chips">' + '<button class="chip' + (DEPO === 'todos' ? ' on' : '') + '" data-depo="todos">Todos (' + ligas.length + ')</button>' +
    DEPORTES.map(d => '<button class="chip' + (DEPO === d[0] ? ' on' : '') + (porDep(d) ? '' : ' cero') + '" data-depo="' + d[0] + '">' + d[1] + ' (' + porDep(d) + ')</button>').join('') + '</div>';
  const d = DEPORTES.find(x => x[0] === DEPO);
  if (d && d[2].length > 1) h += '<div class="chips">' + '<button class="chip' + (LIGA === 'todas' ? ' on' : '') + '" data-liga="todas">Todas</button>' +
    d[2].map(l => '<button class="chip' + (LIGA === l ? ' on' : '') + (n[l] ? '' : ' cero') + '" data-liga="' + esc(l) + '">' + esc(l) + ' (' + (n[l] || 0) + ')</button>').join('') + '</div>';
  return h;
}
function enlazarChips(raiz, repintar) {
  /* el filtro escogido queda a la vista aunque la fila de filtros sea más ancha que la pantalla */
  raiz.querySelectorAll('.chips').forEach(f => { const on = f.querySelector('.chip.on'); if (on) f.scrollLeft = on.offsetLeft - 16; });
  raiz.querySelectorAll('[data-depo]').forEach(b => b.onclick = () => { DEPO = b.dataset.depo; LIGA = 'todas'; repintar(); });
  raiz.querySelectorAll('[data-liga]').forEach(b => b.onclick = () => { LIGA = b.dataset.liga; repintar(); });
}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hora = ts => new Date(ts).toLocaleString('es-US', { timeZone: 'America/Chicago', weekday: 'short', hour: 'numeric', minute: '2-digit' });
const hace = ts => { const m = Math.round((Date.now() - ts) / 60000); return m < 60 ? 'hace ' + m + ' min' : (m < 1440 ? 'hace ' + Math.round(m / 60) + ' h' : 'hace ' + Math.round(m / 1440) + ' d'); };
const cuota = v => v == null ? '—' : (v > 0 ? '+' : '') + v;
const ICON = { rapido: '⚡', acumulado: '📈', kalshi: '🔀' };
const NOMT = { rapido: 'Rápido (2 h)', acumulado: 'Desde la apertura', kalshi: 'Kalshi vs casa' };
const magTxt = s => (s.unidad === 'línea' ? s.mag + ' de línea' : '+' + s.mag + ' pts');
const pct = v => v == null ? '—' : v.toFixed(1) + '%';
const sig = v => v == null ? '—' : '<span class="' + (v > 0 ? 'pos' : (v < 0 ? 'neg' : '')) + '">' + (v > 0 ? '+' : '') + v.toFixed(1) + '%</span>';

async function cargar(f) { try { const r = await fetch(BASE + f + '?v=' + Math.floor(Date.now() / 3e5)); return r.ok ? await r.json() : null; } catch (e) { return null; } }

async function inicio() {
  const [hoy, sen, med, hist, est, ant] = await Promise.all(['hoy.json', 'senales-recientes.json', 'medicion.json', 'historia.json', 'estado.json', 'anticipados-recientes.json'].map(cargar));
  Object.assign(D, { hoy, sen: sen || [], med, hist, est, ant: ant || [], _jx: null });
  pintarEstado(); pintarSenales(); pintarAntes(); pintarJuegos(); pintarMedicion(); pintarInfo();
}
function pintarEstado() {
  const e = D.est;
  if (!e) { $('#estado').innerHTML = '<span class="punto viejo"></span><span>Todavía no hay datos: el robot corre cada 10 minutos.</span>'; return; }
  const t = Date.parse(e.ultima), viejo = Date.now() - t > 40 * 60000, u = e.ultimaVuelta || {};
  const conLinea = (D.hoy && D.hoy.juegos || []).length;
  $('#estado').innerHTML = '<span class="punto' + (viejo ? ' viejo' : '') + '"></span><span>Vuelta ' + hace(t) + ' · ' + conLinea + ' con línea' +
    (u.fotografiados > conLinea ? ' · ' + u.fotografiados + ' vigilados' : '') + (viejo ? ' · <b style="color:var(--bad)">el robot está atrasado</b>' : '') + '</span>';
}
/* ---------- utilidades de cuotas ---------- */
const imp = a => (a == null ? null : (a > 0 ? 100 / (a + 100) : -a / (-a + 100)));
const pct0 = p => p == null ? '—' : Math.round(p * 100) + '%';
const fmtL = v => v == null ? '' : (v > 0 ? '+' : '') + v;
const SELLO = { probada: '<span class="sello ok">✅ Probada</span>', pierde: '<span class="sello mal">⛔ Viene perdiendo</span>', prueba: '<span class="sello">🧪 En prueba</span>' };
const ACIERTO = { alto: '<span class="sello ok">🎯 Alto acierto</span>', va: '<span class="sello">🎯 Va acertando</span>' };
const hayRecord = () => !!(D.med && (D.med.porTipoMercado || []).some(g => g.n > 0));
function juegoDe(id) { if (!D._jx) { D._jx = {}; ((D.hoy && D.hoy.juegos) || []).forEach(g => { D._jx[g.id] = g; }); } return D._jx[id] || null; }

/* ---------- ficha de fuerza ---------- */
const PUNTO = { mercado: '📈 Mercado', modelo: '🧠 Modelo OVA', otros: '🔀 Otros mercados', contexto: '📋 Contexto' };
const ESTADO = { favor: '✅', contra: '❌', neutro: '➖', sin: '⚪' };
const grupoFz = p => (p >= 3 ? '+3' : (p <= -1 ? 'neg' : (p === 0 ? '0' : '+' + p)));
const NOM_MK = { ml: 'Ganador', sp: 'Hándicap', tot: 'Total' };
function insignia(f) {
  const cl = f.puntaje >= 2 ? 'ok' : (f.puntaje <= -1 ? 'mal' : '');
  return '<span class="sello ' + cl + '">💪 ' + (f.puntaje > 0 ? '+' : '') + f.puntaje + ' · ✅' + f.favor + ' ❌' + (f.contra || 0) + ' de ' + f.n + '</span>';
}
function puntosHtml(pts) {
  return '<div class="puntos">' + pts.map(p => '<div class="pto ' + p[1] + '"><span>' + ESTADO[p[1]] + '</span><div><b>' + PUNTO[p[0]] + '</b> ' + esc(p[2]) + '</div></div>').join('') + '</div>';
}
function recordFicha(mt, puntaje) {
  const fc = D.med && D.med.fuerzaCierre, x = fc && fc.porMercado && fc.porMercado[mt];
  const g = x && (x.tramos || []).find(t => t.clave === grupoFz(puntaje));
  if (!g || !g.n) return '<div class="rec">🧪 Todavía no hay juegos terminados con esta fuerza en ' + NOM_MK[mt].toLowerCase() + '. Se mide sola.</div>';
  return '<div class="rec">Fichas ' + esc(g.nombre) + ' en ' + NOM_MK[mt].toLowerCase() + ': 🎯 aciertan <b>' + pct(g.gana) + '</b> en ' + g.n + ' (la cuota prometía ' + pct(g.promete) + ') · ROI ' + sig(g.roi) + ' ' + (ACIERTO[g.acierto] || '') + (g.n < 300 ? '🧪 en prueba' : '') + '</div>';
}
function fichaHtml(g) {
  const F = g.ficha; if (!F) return '';
  const lado = (mk, f) => mk === 'tot' ? f.quien.replace(/^el /, '') + ' de ' + f.l : f.quien + (mk === 'sp' && f.l != null ? ' ' + fmtL(f.l) : '');
  let h = '';
  if (F.ml) h += '<div class="fila"><b>💪 Ficha · ' + (F.ml.quien === 'el empate' ? 'Empate' : esc(F.ml.quien) + ' gana') + '</b>' + insignia(F.ml) + '</div>' + puntosHtml(F.ml.pts) + recordFicha('ml', F.ml.puntaje);
  const otros = ['sp', 'tot'].filter(k => F[k]);
  if (otros.length) h += '<details><summary>💪 Hándicap y total</summary>' + otros.map(k => '<div class="sub"><div class="fila"><b>' + NOM_MK[k] + ' · ' + esc(lado(k, F[k])) + '</b>' + insignia(F[k]) + '</div>' + puntosHtml(F[k].pts) + recordFicha(k, F[k].puntaje) + '</div>').join('') + '</details>';
  return h ? '<div class="ficha">' + h + '</div>' : '';
}

/* las señales del mismo juego + mercado + lado son un solo movimiento (sale como ⚡ y 📈, o sube de nivel) */
function agrupar(lista) {
  const g = {};
  lista.slice().sort((a, b) => a.t - b.t).forEach(s => {
    const k = s.jid + '|' + s.mk + '|' + s.lado;
    const m = g[k] = g[k] || { key: k, jid: s.jid, mk: s.mk, mt: s.mt, lado: s.lado, liga: s.liga, partido: s.partido, ts: s.ts, dep: s.dep, sen: [] };
    m.sen.push(s);
  });
  return Object.values(g).map(m => {
    m.ult = m.sen[m.sen.length - 1];
    m.tipos = [...new Set(m.sen.map(s => s.tipo))];
    m.mag = Math.max(...m.sen.map(s => s.mag));
    m.unidad = m.ult.unidad;
    m.res = (m.sen.find(s => s.res && s.res !== 'nula') || m.sen.find(s => s.res) || {}).res || null;
    return m;
  });
}
/* cómo está ese lado ahora mismo y si todavía conviene (comparado con la señal) */
function ahoraDe(mv) {
  const j = juegoDe(mv.jid); if (!j) return null;
  if (j.st !== 'pre') return { sem: 'gris', txt: '🔒 Ya empezó: no se puede entrar antes del juego' };
  const m = j.m[mv.mk]; if (!m || !m.ahora) return null;
  const c = m.ahora.c[mv.lado], L = m.ahora.l == null ? null : (mv.mt === 'sp' && mv.lado === 1 ? -m.ahora.l : m.ahora.l);
  const s = mv.ult, l0 = s.l;
  const linea = L == null ? cuota(c) : 'línea ' + (mv.mt === 'sp' ? fmtL(L) : L) + ' · ' + cuota(c);
  let mejor = 0;
  if (L != null && l0 != null && L !== l0) mejor = mv.mt === 'sp' ? L - l0 : (mv.lado === 0 ? l0 - L : L - l0);
  if (mejor > 0) return { sem: 'verde', txt: '🟢 Ahora: ' + linea + ' · mejor que en la señal' };
  if (mejor < 0) return { sem: 'rojo', txt: '🔴 Ahora: ' + linea + ' · ya se movió más: llegaste tarde' };
  const dp = (imp(s.c) - imp(c)) * 100;                    /* + = ahora pagan más que en la señal */
  if (dp >= -0.3) return { sem: 'verde', txt: '🟢 Ahora: ' + linea + ' · todavía se consigue igual o mejor' };
  if (dp >= -1.5) return { sem: 'amarillo', txt: '🟡 Ahora: ' + linea + ' · casi igual (un poco peor)' };
  return { sem: 'rojo', txt: '🔴 Ahora: ' + linea + ' · ya se movió más: llegaste tarde' };
}
function recordDe(mv) {
  if (!hayRecord()) return '';
  const partes = mv.tipos.map(t => {
    const g = (D.med.porTipoMercado || []).find(x => x.clave === t + '|' + mv.mt);
    if (!g || !g.n) return ICON[t] + ' sin resultados';
    return ICON[t] + ' 🎯 acierta <b>' + pct(g.gana) + '</b> en ' + g.n + ' (la cuota prometía ' + pct(g.promete) + ') · ROI ' + sig(g.roi) + ' ' + (ACIERTO[g.acierto] || '') + (SELLO[g.veredicto] || SELLO.prueba);
  });
  return '<div class="rec">Récord de este tipo: ' + partes.join('<br>') + '</div>';
}
function bloqueMov(mv) {
  const s = mv.ult, icon = mv.tipos.map(t => ICON[t]).join('');

      prog.map(x => '<div style="margin:9px 0"><div class="fila"><span style="font-size:13.5px">' + esc(x.nombre) + '</span><span class="meta">' + x.resueltas + '/300 · esperando ' + x.pendientes + '</span></div><div class="barra"><i style="width:' + Math.min(100, x.resueltas / 3) + '%"></i></div></div>').join('') + '</div>';
  }
  if (!n) h += '<div class="aviso">Todavía no hay señales resueltas. Cada señal se mide cuando termina su juego. Con menos de 300 resueltas los porcentajes saltan mucho: <b>no apuestes plata real por esta tabla todavía</b>.</div>';
  else {
    const t = m.total;
    h += (n < 300 ? '<div class="aviso">Van ' + n + ' señales resueltas. Hasta 300–500 los números todavía bailan (margen ±' + (t.margen || '?') + ' pts).</div>' : '') +
      '<div class="resumen"><div class="card"><div class="grande">' + n + '</div><div class="meta">resueltas</div></div><div class="card"><div class="grande">🎯 ' + pct(t.gana) + '</div><div class="meta">aciertan (prometían ' + pct(t.promete) + ')</div></div><div class="card"><div class="grande">' + sig(t.roi) + '</div><div class="meta">rendimiento</div></div></div>' +
      '<div class="card"><b>Indicador temprano · cierre a favor: ' + pct(t.clvFavor) + '</b><p class="nota" style="margin:4px 0 0">El % de aciertos tarda cientos de juegos en asentarse; el cierre a favor (CLV) se asienta mucho antes. Si una señal deja el cierre a favor más del 55% de las veces, va por buen camino.</p></div>';
    h += '<h2>Por tipo de señal</h2>' + tabla(m.porTipo, COLS_SEN);
    h += '<h2>Por mercado</h2>' + tabla(m.porMercado, COLS_SEN);
    h += '<h2>Tipo × mercado (el que decide)</h2>' + tabla(m.porTipoMercado, COLS_SEN.concat([['', f => ({ probada: '✅', pierde: '⛔', prueba: '🧪' }[f.veredicto] || '')]]));
    h += '<h2>Por fuerza del movimiento</h2>' + tabla(m.porNivel, COLS_SEN);
    h += '<h2>Por tramo de probabilidad</h2>' + tabla(m.porTramo, COLS_SEN);
    h += '<h2>Por deporte</h2>' + tabla(m.porDeporte, COLS_SEN);
    h += '<p class="nota"><b>Gana</b> = % de aciertos sin contar push. <b>Prometía</b> = lo que decía la cuota (sin margen) en el momento de la señal: si Gana queda por encima de Prometía con muchas señales, ahí hay algo. <b>ROI</b> = apostando 1 a la cuota de la señal. <b>En contra</b> = apostando al otro lado. <b>CLV +</b> = % de veces que el cierre terminó mejor para quien entró en la señal.</p>';
  }
  const an = m && m.anticipados;
  h += '<h2>📅 Picks anticipados</h2>';
  if (!an || !an.resueltos) h += '<div class="aviso">Todavía no hay picks anticipados resueltos' + (an && an.total ? ' (van ' + an.total + ' congelados, esperando su juego)' : '') + '. Aquí vas a ver si adelantarse acierta más y consigue mejores líneas que jugar al cierre.</div>';
  else {
    const COLS_ANT = [['Pick', x => esc(x.nombre)], ['N', x => x.n], ['Acierta', x => '<b>' + pct(x.gana) + '</b>'], ['Prometía', x => pct(x.promete)], ['ROI antes', x => sig(x.roi)], ['ROI cierre', x => sig(x.roiCierre)], ['Línea mejor antes', x => pct(x.clvFavor)]];
    h += '<div class="card">' + tabla(an.porTipo, COLS_ANT) + '<p class="nota"><b>ROI antes</b> = jugando al precio congelado. <b>ROI cierre</b> = el mismo pick jugado al cierre. <b>Línea mejor antes</b> = % de veces que adelantarse consiguió mejor línea que el cierre. Si «ROI antes» le gana a «ROI cierre» y la línea mejor antes pasa del 55%, adelantarse sirve.</p></div>';
    if (an.porFuerza && an.porFuerza.length) h += '<div class="card"><b>Según la fuerza de la ficha</b>' + tabla(an.porFuerza, COLS_ANT) + '</div>';
  }
  const fc = m && m.fuerzaCierre;
  h += '<h2>💪 Ficha de fuerza</h2>';
  const COLS_FZ = [['Fuerza', f => esc(f.nombre)], ['N', f => f.n], ['Gana', f => pct(f.gana)], ['Prometía', f => pct(f.promete)], ['ROI', f => sig(f.roi)], ['±', f => f.margen == null ? '—' : f.margen]];
  if (!fc || !fc.n) h += '<div class="aviso">Todavía no hay juegos terminados con ficha. Cada juego guarda su ficha al empezar y se mide al terminar, jugando el lado con más fuerza a la cuota de cierre.</div>';
  else {
    if (fc.completas && fc.completas.length) h += '<div class="card"><b>Solo fichas completas</b> <span class="meta">· 3 o 4 puntos con dato (la más confiable)</span>' + tabla(fc.completas, COLS_FZ) + '</div>';
    h += '<div class="card"><b>Al cierre de cada juego</b> <span class="meta">· ' + fc.n + ' mercados</span>' + tabla(fc.todos, COLS_FZ) +
      '<p class="nota">La pregunta: ¿las fichas con más fuerza ganan más de lo que prometía su cuota de cierre? Si 💪💪💪 gana por encima de «Prometía» (más allá del ±) con cientos de juegos, la ficha sirve. Si no, es solo una explicación.</p></div>';
    Object.values(fc.porMercado || {}).forEach(x => { h += '<details class="card"><summary>' + esc(x.nombre) + ' · ' + x.n + '</summary>' + tabla(x.tramos, COLS_FZ) + '</details>'; });
  }
  if (m && m.fuerzaSenales && m.fuerzaSenales.length) h += '<div class="card"><b>Señales según su fuerza</b>' + tabla(m.fuerzaSenales, COLS_SEN) + '</div>';
  const cal = m && m.calibracion ? Object.values(m.calibracion) : [];
  if (cal.length) {
    h += '<h2>¿Cuánto acierta cada cuota? (juegos propios)</h2>';
    cal.forEach(c => { h += '<div class="card"><b>' + esc(c.nombre) + '</b> <span class="meta">· ' + c.n + ' mercados al cierre</span>' + tabla(c.tramos.filter(x => x.n), [['Favorito', x => x.tramo], ['N', x => x.n], ['Promete', x => pct(x.promete)], ['Gana', x => pct(x.gana)], ['±', x => x.margen == null ? '—' : x.margen]]) + '</div>'; });
  }
  const H = D.hist;
  if (H && H.todos) {
    const t = H.todos;
    h += '<h2>Estudio histórico · ' + t.juegos.toLocaleString('es-US') + ' juegos</h2>';
    h += '<p class="nota">Cierres de DraftKings que ya guarda ODDX (MLB desde 2023; NBA, NHL y NFL de esta temporada). Solo el ganador.</p>';
    h += '<div class="card"><b>¿Cuánto acierta la cuota de cierre?</b>' + tabla(t.calibracion.filter(x => x.n), [['Favorito', x => x.tramo], ['N', x => x.n.toLocaleString('es-US')], ['Promete', x => pct(x.promete)], ['Gana', x => pct(x.gana)], ['±', x => x.margen]]) +
      '<p class="nota">Si Gana ≈ Promete (dentro del ±), el cierre está bien puesto: no hay ventaja en apostar por apostar.</p></div>';
    h += '<div class="card"><b>Cuando la línea se mueve de la apertura al cierre</b>' + tabla(t.movimiento.filter(x => x.n), [['Se movió (pts)', x => x.tramo], ['N', x => x.n.toLocaleString('es-US')], ['Gana', x => pct(x.gana)], ['Temprano', x => sig(x.roiTemprano)], ['Tarde', x => sig(x.roiTarde)], ['En contra', x => sig(x.roiContra)]]) +
      '<p class="nota"><b>Temprano</b> = entrar a la cuota de apertura al lado que DESPUÉS subió (no se puede saber de antemano: muestra dónde vive el valor). <b>Tarde</b> = seguir el movimiento a la cuota de cierre. <b>En contra</b> = el otro lado al cierre.</p></div>';
    Object.keys(H.deportes || {}).forEach(d => {
      const x = H.deportes[d];
      h += '<details class="card"><summary>' + d.toUpperCase() + ' · ' + x.juegos.toLocaleString('es-US') + ' juegos</summary>' + tabla(x.movimiento.filter(y => y.n), [['Se movió (pts)', y => y.tramo], ['N', y => y.n], ['Gana', y => pct(y.gana)], ['Temprano', y => sig(y.roiTemprano)], ['Tarde', y => sig(y.roiTarde)], ['En contra', y => sig(y.roiContra)]]) + '</details>';
    });
  }
  $('#v-medir').innerHTML = h || '<div class="vacio">Sin datos todavía.</div>';
}
function pintarInfo() {
  $('#v-info').innerHTML = `
  <h2>Qué hace TIGRE</h2>
  <div class="card"><p>Cada 10 minutos un robot en GitHub fotografía las líneas de <b>DraftKings</b> (vía ESPN) de los juegos de las próximas 36 horas —ganador, hándicap, total y props de jugador en NBA, NHL y NFL— y el precio de <b>Kalshi</b>. También NCAA Football y NCAA Básquet (ganador, hándicap y total: mercados más blandos que los profesionales). Fútbol: Premier, La Liga, Serie A, Bundesliga, Ligue 1, Champions, Europa League, MLS y Liga MX. La NFL y la NCAA Football se vigilan toda la semana (sus líneas se mueven de lunes a domingo). <b>Tenis</b> (ATP, WTA, Challenger y Copa Davis): ESPN no trae cuotas, así que sale de Kalshi, con el precio de compra y la comisión ya incluidos en la cuota. MLB y el tenis entran solos cuando empiece su temporada.</p></div>
  <h2>Las señales</h2>
  <div class="card"><ul class="lista">
    <li><b>⚡ Rápido:</b> el mercado se movió fuerte en las últimas 2 horas (ganador 3+ pts de probabilidad; hándicap/total según el deporte; props 1 punto de línea o 8 pts de precio).</li>
    <li><b>📈 Desde la apertura:</b> la línea ya se movió mucho desde que abrió la casa (ganador 5+ pts).</li>
    <li><b>🔀 Kalshi vs casa:</b> Kalshi y DraftKings no coinciden en el ganador por 4+ pts.</li>
  </ul><p class="nota">Cada señal guarda la cuota en ese momento. Cuando termina el juego se resuelve sola y se compara con la línea de cierre (CLV).</p></div>
  <h2>💪 La ficha de fuerza</h2>
  <div class="card"><p>Cada juego trae una ficha que dice <b>por qué</b> una línea tiene fuerza, con un dato en cada punto:</p><ul class="lista">
    <li><b>📈 Mercado:</b> si la línea se movió hacia ese lado desde la apertura (ganador 2+ pts; hándicap y total medio punto de línea).</li>
    <li><b>🧠 Modelo OVA:</b> si tu modelo le da 3+ pts más que la casa. Sale del robot de la liga de ODDX, solo se lee, no se toca nada.</li>
    <li><b>🔀 Otros mercados:</b> si Kalshi o Polymarket le dan 2+ pts más que la casa (solo ganador).</li>
    <li><b>📋 Contexto:</b> fútbol: puntos en los últimos 5 (3+ de diferencia). NBA, NHL, NFL y NCAA: % de victorias en casa contra fuera (10+ pts).</li>
  </ul><p>✅ a favor · ❌ en contra · ➖ hay dato pero no inclina · ⚪ no hay dato. La fuerza = a favor − en contra. La ficha muestra el lado con más fuerza.</p>
  <p class="nota">Ojo: en fútbol, en tu propia liga de modelos el mercado le gana al Modelo OVA. Por eso la ficha se mide sola: al empezar cada juego se guarda y al terminar se ve si las fichas fuertes ganan más de lo que prometía su cuota. Hasta que eso pase, la ficha explica, no garantiza.</p></div>
  <h2>📅 Picks anticipados</h2>
  <div class="card"><p>En vez de perseguir la línea cuando ya se movió, TIGRE se <b>adelanta</b>: entre 26 y 3 horas antes de cada juego congela el lado con más fuerza de la ficha (ganador, hándicap y total) con su precio. En props congela el favorito apenas sale la línea (las primeras líneas suelen ser las más flojas).</p>
  <p class="nota">Se mide en aciertos, en rendimiento al precio de antes contra el mismo pick al cierre, y en cuántas veces la línea de antes era mejor. Si te avisa un 📅 con 💪 +2 o más, es un pick congelado con fuerza.</p></div>
  <h2>Cómo leer la medición</h2>
  <div class="card"><p>La pregunta es una sola: <b>¿esa señal acierta más de lo que promete su cuota?</b> Si una señal promete 55% y gana 55%, no hay ventaja (y el margen de la casa te come). Solo vale la que gane claramente por encima, con cientos de casos, y que además deje el cierre a favor (CLV +).</p></div>
  <h2>Los sellos</h2>
  <div class="card"><ul class="lista">
    <li><b>✅ Probada:</b> 300+ resueltas, gana por encima de lo que prometía más allá del margen de error, ROI positivo y el cierre a favor.</li>
    <li><b>🧪 En prueba:</b> todavía no se sabe. Mírala, no la juegues fuerte.</li>
    <li><b>⛔ Viene perdiendo:</b> 100+ resueltas y −3% o peor. Si acaso, mira la columna «En contra».</li>
    <li><b>🎯 Alto acierto:</b> 100+ resueltas y acierta 60% o más, aunque pague poco. <b>🎯 Va acertando:</b> lo mismo con 30+ (todavía puede cambiar).</li>
  </ul><p class="nota">Buscamos las dos cosas: <b>aciertos</b> (🎯) y que <b>acierte más de lo que prometía su cuota</b> (✅). En 🧪 Medición, «Lo que más acierta» ordena todo por % de aciertos.</p></div>
  <h2>Regla de oro</h2>
  <div class="aviso">Nada de plata real hasta tener 300–500 señales resueltas de ese tipo. Si después de medir ninguna señal pasa, también es un resultado: te ahorra perder.</div>
  <h2>Lo que hay que saber</h2>
  <div class="card"><ul class="lista">
    <li>El robot corre cada 10 min: no caza movimientos de segundos. Su ventaja es medir qué tipo de movimiento funciona. Los avisos se juntan y te llegan como mucho cada 25 min (los movimientos fuertes, enseguida).</li>
    <li>En el estudio histórico, entrar temprano al lado que después sube rinde, y seguir el movimiento tarde pierde: el valor está antes del movimiento, no después.</li>
    <li>Las casas limitan a los que ganan; Kalshi es un mercado entre personas y eso pasa mucho menos.</li>
    <li>No soy asesor financiero: esto es una herramienta de medición, no una garantía.</li>
  </ul></div>`;
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === 'v-' + b.dataset.v));
  scrollTo(0, 0);
});
inicio();
setInterval(inicio, 5 * 60000);
